<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Multition — WE connect, YOU collab</title>
  <desc id="description">Multition — WE connect, YOU collab. Ứng dụng giúp học sinh, sinh viên khám phá cuộc thi, ghép đội thủ công và nhận gợi ý đồng đội từ AI.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10283D"/>
      <stop offset="0.58" stop-color="#0B2135"/>
      <stop offset="1" stop-color="#071A2C"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#1CCDB2" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#1CCDB2" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-35%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#00101F" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#navy)"/>
  <path d="M0 0H1920V44H0Z" fill="#19C4AF"/>
  <circle cx="1650" cy="290" r="600" fill="url(#glow)"/>
  <path d="M1110 0C1250 128 1360 203 1542 230" fill="none" stroke="#23566A" stroke-width="2" opacity="0.65"/>
  <path d="M1378 1080C1590 930 1755 908 1920 940" fill="none" stroke="#23566A" stroke-width="2" opacity="0.65"/>

  <!-- Brand mark uses the original logo shapes and palette. -->
  <rect x="140" y="140" width="340" height="340" rx="64" fill="#FFFFFF" filter="url(#softShadow)"/>
  <g transform="translate(174 174) scale(1.7)">
