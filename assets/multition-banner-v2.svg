  <text x="578" y="174" fill="#86C8C1" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="5">TEAM FORMATION</text>
  <text x="564" y="341" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="180" font-weight="700" letter-spacing="-7">Multition</text>
  <text x="576" y="444" font-family="Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1.5" xml:space="preserve"><tspan fill="#3EE3C9">WE connect,</tspan><tspan fill="#FFFFFF"> YOU collab</tspan></text>

  <rect x="140" y="544" width="111" height="8" rx="4" fill="#28D4BA"/>
  <text x="140" y="635" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1">Tìm cuộc thi. Kết nối đồng đội. Cùng lập đội.</text>
  <text x="145" y="697" fill="#A9C6C8" font-family="Arial, sans-serif" font-size="33">Ứng dụng dành cho học sinh, sinh viên muốn xây dựng đội hình phù hợp cho cuộc thi.</text>

  <!-- Features explain the product while the brand remains the main visual. -->
  <g font-family="Arial, sans-serif">
    <rect x="140" y="762" width="524" height="220" rx="30" fill="#143448" stroke="#31596A" stroke-width="2"/>
    <circle cx="192" cy="817" r="23" fill="#225969"/>
    <g fill="none" stroke="#3EE3C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="192" cy="817" r="13"/>
      <path d="M197 811L189 815L187 823L195 819Z"/>
    </g>
    <text x="236" y="831" fill="#FFFFFF" font-size="36" font-weight="700">Khám phá cuộc thi</text>
    <text x="174" y="895" fill="#ADC9CA" font-size="29">Tìm cuộc thi theo lĩnh vực,</text>
    <text x="174" y="936" fill="#ADC9CA" font-size="29">địa điểm và thời hạn.</text>

    <rect x="698" y="762" width="524" height="220" rx="30" fill="#143448" stroke="#31596A" stroke-width="2"/>
    <circle cx="750" cy="817" r="23" fill="#225969"/>
    <g fill="none" stroke="#3EE3C9" stroke-width="3" stroke-linecap="round">
      <circle cx="745" cy="812" r="6"/>
      <path d="M734 827C734 817 756 817 756 827M760 810V822M754 816H766"/>
    </g>
    <text x="794" y="831" fill="#FFFFFF" font-size="36" font-weight="700">Ghép đội thủ công</text>
    <text x="732" y="895" fill="#ADC9CA" font-size="29">Xem hồ sơ, đăng tuyển,</text>
    <text x="732" y="936" fill="#ADC9CA" font-size="29">gửi lời mời và ứng tuyển.</text>

    <rect x="1256" y="762" width="524" height="220" rx="30" fill="#0D4C53" stroke="#2CAB9E" stroke-width="2"/>
    <circle cx="1308" cy="817" r="23" fill="#176B6A"/>
    <g fill="none" stroke="#71F4DB" stroke-width="3" stroke-linecap="round">
      <circle cx="1305" cy="814" r="9"/>
      <path d="M1312 821L1320 829M1305 810V818M1301 814H1309"/>
    </g>
    <text x="1352" y="831" fill="#FFFFFF" font-size="36" font-weight="700">AI hỗ trợ ghép đội</text>
    <text x="1290" y="895" fill="#BCE6DF" font-size="29">Tìm người theo kỹ năng còn thiếu.</text>
    <text x="1290" y="936" fill="#BCE6DF" font-size="29">Gợi ý để bạn tự quyết định.</text>
  </g>
</svg>
